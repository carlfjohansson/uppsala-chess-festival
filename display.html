<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uppsala Schackfestival 2026 — Live Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --light-sq: #e8c870;
      --dark-sq:  #4a7ec4;
      --lm-light: #f5e040;
      --lm-dark:  #6a9fd8;
      --bg:       #f8f6f2;
      --navy:     #0d3a6e;
      --gold:     #f5cb6b;
      --accent:   #c07010;
      --border:   rgba(18,32,58,0.12);
      --text:     #12203a;
      --muted:    rgba(18,32,58,0.45);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    /* ── Topplisten ─────────────────────────────────────── */
    .drd-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px 0;
  max-width: 1200px; margin: 0 auto;
}
.drd-label { font-size: .8rem; font-weight: 700; color: var(--muted,#888); letter-spacing: .06em; text-transform: uppercase; }
.drd-btn {
  background: #fff; border: 1px solid #ccc; border-radius: 6px;
  color: #333; font-family: inherit; font-size: .85rem; font-weight: 700;
  padding: 5px 14px; cursor: pointer; transition: all .15s;
}
.drd-btn:hover { border-color: #1a2744; color: #1a2744; }
.drd-btn.active { background: #1a2744; color: #c9a84c; border-color: #1a2744; }
#top {
      height: 4.2vh; min-height: 34px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.2vw;
      background: var(--navy);
      border-bottom: 3px solid var(--gold);
      flex-shrink: 0;
    }
    #top h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1rem, 2.2vh, 1.5rem);
      color: var(--gold);
      letter-spacing: 0.08em;
    }
    .live-dot {
      display: inline-block; width: 0.65em; height: 0.65em;
      background: #e74c3c; border-radius: 50%;
      animation: pulse 1.4s infinite; margin-right: 0.4em;
      vertical-align: middle;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
    #clock {
      font-size: clamp(0.8rem, 1.8vh, 1.1rem);
      color: rgba(245,203,107,0.6);
      font-variant-numeric: tabular-nums;
    }

    /* ── Huvud-grid: 4 kolumner × (rubrik + 3 bräden) ── */
    #grid {
      height: calc(100vh - 7.8vh);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: auto 1fr 1fr 1fr;
      overflow: hidden;
    }

    /* Grupprubrik */
    .g-hdr {
      background: var(--navy);
      border-right: 1px solid rgba(245,203,107,0.2);
      border-bottom: 2px solid rgba(245,203,107,0.25);
      padding: 0.3vh 0.8vw;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(0.7rem, 1.5vh, 1rem);
      color: var(--gold);
      letter-spacing: 0.07em;
      display: flex; align-items: center;
    }

    /* Bord-cell */
    .bc {
      background: var(--bg);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
      padding: 0.5vh 0.55vw 0.3vh;
    }
    .bc:nth-child(4n) { border-right: none; }

    .bc-hdr {
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; margin-bottom: 0.25vh;
    }
    .bc-num {
      font-size: clamp(0.5rem, 1vh, 0.7rem);
      text-transform: uppercase; letter-spacing: .12em;
      color: var(--muted); font-weight: 700;
    }
    .bc-result {
      font-size: clamp(0.5rem, 1vh, 0.68rem);
      font-weight: 700; color: var(--accent);
    }

    .p-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .p-dot.w { background: #f0f0f0; border: 1px solid #aaa; }
    .p-dot.b { background: #1a1a1a; border: 1px solid #777; }

    /* Spelarrad ovanför/under brädet */
    .bc-player {
      display: flex; align-items: center; gap: 0.4em;
      font-size: clamp(0.58rem, 1.2vh, 0.82rem);
      font-weight: 700; flex-shrink: 0;
      padding: 0.1vh 0; overflow: hidden;
    }
    .bc-player-name {
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bc-player-rating { color: var(--muted); font-size: 0.82em; flex-shrink: 0; }
    .p-clock {
      margin-left: auto; flex-shrink: 0;
      font-size: clamp(0.52rem, 1.05vh, 0.7rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700; letter-spacing: 0.02em;
      color: var(--muted);
      background: rgba(18,32,58,0.06);
      border-radius: 3px; padding: 0 3px;
    }
    .p-clock.active { color: var(--accent); background: rgba(192,112,16,0.12); }
    .p-clock.low { color: #c0392b; background: rgba(192,57,43,0.1); }

    /* Spelarinfo i dragspalten */
    .ml-col {
      flex: 1; min-width: 0; min-height: 0; height: 100%;
      display: flex; flex-direction: column; gap: 0.4vh;
      overflow: hidden;
    }
    .ml-players { flex-shrink: 0; }
    .mlp-row {
      display: flex; align-items: center; gap: 0.35em;
      font-size: clamp(0.55rem, 1.1vh, 0.78rem);
      font-weight: 700; line-height: 1.45;
      overflow: hidden;
    }
    .mlp-name {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }
    .mlp-rating { color: var(--muted); font-size: 0.82em; flex-shrink: 0; }
    .mlp-title  { color: var(--accent); font-size: 0.78em; flex-shrink: 0; }
    .p-title {
      font-size: clamp(0.48rem, 0.85vh, 0.62rem);
      font-weight: 700; color: var(--accent);
      flex-shrink: 0;
    }

    /* Bräde + draglista sida vid sida */
    .bw {
      flex: 1; min-height: 0;
      display: flex; align-items: center;
      gap: 0.5vw;
      overflow: hidden;
    }
    /* Draglista */
    .ml {
      flex: 1; min-width: 0; min-height: 0;
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none; /* Firefox */
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .ml::-webkit-scrollbar { display: none; }
    .ml-row {
      display: grid;
      grid-template-columns: 1.8em 1fr 1fr;
      gap: 0.1em;
      line-height: 1.55;
      font-size: clamp(0.5rem, 1.05vh, 0.7rem);
      color: var(--text);
    }
    .ml-num { color: var(--muted); font-size: 0.85em; text-align: right; padding-right: 0.2em; }
    .ml-w   { font-weight: 700; }
    .ml-b   { color: rgba(18,32,58,0.7); }
    .ml-row.ml-last .ml-w,
    .ml-row.ml-last .ml-b { color: var(--navy); font-weight: 800; }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      /* Bredd begränsas av kolumnbredd OCH tillgänglig höjd */
      width: min(
        calc(25vw - 1.6vw),
        calc((100vh - 10vh) / 3 - 5.5vh)
      );
      border-radius: 3px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
    }
    /* Varje ruta tvingas vara kvadratisk — height sätts automatiskt */
    .sq { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
    .sq.li { background: var(--light-sq); }
    .sq.da { background: var(--dark-sq);  }
    .sq.ll { background: var(--lm-light); }
    .sq.ld { background: var(--lm-dark);  }
    .sq img {
      width: 80%; height: 80%; pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.4));
      -webkit-user-drag: none;
    }
    .sq[draggable="true"] { cursor: grab; }
    .sq[draggable="true"]:active { cursor: grabbing; }

    /* ── Enkelbräde-läge ────────────────────────────── */
    .single-wrap {
      height: calc(100vh - 4.2vh);
      display: flex; flex-direction: column;
      padding: 1.2vh 1.5vw 1vh;
      overflow: hidden;
    }
    .single-hdr {
      flex-shrink: 0;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(0.8rem, 1.6vh, 1.1rem);
      color: var(--navy); letter-spacing: 0.07em;
      margin-bottom: 0.8vh;
    }
    .single-bw {
      flex: 1; min-height: 0;
      display: flex; align-items: center; gap: 2vw;
      overflow: hidden;
    }
    .single-board-grid {
      display: grid; grid-template-columns: repeat(8, 1fr);
      width: min(calc(72vw - 4vw), calc(100vh - 4.2vh - 5vh));
      border-radius: 4px; overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,.22);
      flex-shrink: 0;
    }
    .single-board-grid .sq { aspect-ratio: 1; }
    .single-ml-col {
      flex: 1; min-width: 0; min-height: 0; height: 100%;
      display: flex; flex-direction: column; gap: 1vh;
      overflow: hidden;
    }
    .single-players { flex-shrink: 0; }
    .single-p-row {
      display: flex; align-items: center; gap: 0.5em;
      font-size: clamp(0.85rem, 1.8vh, 1.15rem); font-weight: 700;
      line-height: 1.65;
    }
    .single-p-dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    }
    .single-p-dot.w { background: #f0f0f0; border: 1px solid #999; }
    .single-p-dot.b { background: #1a1a1a; border: 1px solid #666; }
    .single-p-title {
      font-size: 0.72em; font-weight: 700; color: var(--accent);
      background: rgba(192,112,16,.15); padding: 1px 6px; border-radius: 3px;
    }
    .single-p-rating { color: var(--muted); font-size: 0.78em; }
    .single-ml {
      flex: 1; min-height: 0;
      overflow-y: auto; scrollbar-width: thin;
    }
    /* Interaktiv notation */
    .ib-row {
      display: grid; grid-template-columns: 2.2em 1fr 1fr;
      font-size: clamp(0.85rem, 1.8vh, 1.1rem); line-height: 1.9;
    }
    .ib-row .ml-num { color: var(--muted); font-size: 0.85em; text-align: right; padding-right: 0.25em; }
    .ib-w, .ib-b {
      cursor: pointer; border-radius: 3px; padding: 0 3px;
      font-weight: 700;
    }
    .ib-b { color: rgba(18,32,58,0.72); }
    .ib-w:hover, .ib-b:hover { background: rgba(18,32,58,0.08); }
    .ib-cur { background: var(--navy) !important; color: var(--gold) !important; border-radius: 3px; }
    .ib-var-line {
      grid-column: 1/-1;
      font-size: 0.82em; color: var(--muted);
      padding: 0 0 2px 2.2em; line-height: 1.6;
    }
    .ib-vm { cursor: pointer; }
    .ib-vm:hover { color: var(--accent); }
    .ib-vm.ib-cur { color: var(--gold); }
    /* Interaktivt bräde */
    .sq { cursor: pointer; position: relative; }
    .sq.sel-li { background: #f6f669 !important; }
    .sq.sel-da { background: #b9ca43 !important; }
    .ib-dot {
      position: absolute; width: 30%; height: 30%;
      border-radius: 50%; background: rgba(0,0,0,0.18);
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }
    .sq.ib-cap::after {
      content: ''; position: absolute; inset: 0;
      border-radius: 50%; border: 3px solid rgba(0,0,0,0.25);
      pointer-events: none;
    }
    /* Nav-knappar */
    .ib-nav {
      display: flex; gap: 4px; flex-shrink: 0; margin-bottom: 4px;
    }
    .ib-nav-btn {
      background: #f0ede7; border: 1px solid var(--border);
      border-radius: 4px; padding: 2px 9px; cursor: pointer;
      font-size: clamp(0.7rem, 1.4vh, 0.9rem); color: var(--navy);
      font-weight: 700;
    }
    .ib-nav-btn:hover:not(:disabled) { background: #e4e0d8; }
    .ib-nav-btn:disabled { opacity: 0.35; cursor: default; }
    .single-result {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem; color: var(--accent); letter-spacing: .06em;
      margin-left: auto;
    }
    /* Analys */
    .sf-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border);
      background: #f0ede7; color: var(--navy); cursor: pointer;
      font-size: clamp(0.65rem, 1.3vh, 0.85rem); font-weight: 700;
      font-family: 'Inter', sans-serif; letter-spacing: .04em;
      transition: background .15s;
    }
    .sf-btn:hover { background: #e4e0d8; }
    .sf-btn.on { background: var(--navy); color: var(--gold); border-color: var(--navy); }
    /* Lodrätt evalbar till vänster om brädet */
    .board-stack {
      display: flex; align-items: stretch; gap: 4px; flex-shrink: 0;
    }
    .sf-vert-bar {
      width: 10px; flex-shrink: 0;
      border-radius: 3px; overflow: hidden;
      background: #1a1a1a; position: relative;
      display: none;
    }
    .sf-vert-bar.vis { display: block; }
    .sf-vert-fill {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 50%; background: #f0f0f0; transition: height .4s;
    }
    .sf-pv {
      font-size: clamp(0.6rem, 1.2vh, 0.78rem); color: var(--muted);
      display: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex-shrink: 0; padding: 2px 0;
    }
    .sf-pv.vis { display: block; }
    .sf-row { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-top: 4px; }
  </style>
</head>
<body>

<div id="top">
  <div></div>
  <h1><span class="live-dot"></span>Uppsala Schackfestival 2026</h1>
  <div id="clock"></div>
</div>
<div class="drd-bar">
  <span class="drd-label">Rond</span>
  <button class="drd-btn active" onclick="setDisplayRound(1,this)">1</button>

</div>
<div id="grid"></div>

async function fetchFresh(url) {

    if (r.ok) return r;

  const archUrl = url.replace('https://1.pool.livechesscloud.com/get', '/data/archive/lcc');
  return fetch(archUrl);

// ── Sändningsfördröjning ──────────────────────────────────────────────────
const DELAY_MS = 0;  // Ingen fördröjning — display.html visas i spelsalen
const MFS_KEY  = 'ucf_mfs';       // localStorage-nyckel

// Läs in sparade tidsstämplar från localStorage (delas mellan live.html och display.html)
let moveFirstSeen = {};
try {
  const saved = localStorage.getItem(MFS_KEY);
  if (saved) moveFirstSeen = JSON.parse(saved);
} catch(e) {}

function _mfsSave() {
  try { localStorage.setItem(MFS_KEY, JSON.stringify(moveFirstSeen)); } catch(e) {}
}

// Rensa poster äldre än 2 dygn (håller localStorage liten)
(function _mfsPrune() {
  const cutoff = Date.now() - 2 * 24 * 60 * 60 * 1000;
  let pruned = false;
  for (const k of Object.keys(moveFirstSeen)) {
    if (moveFirstSeen[k] < cutoff) { delete moveFirstSeen[k]; pruned = true; }
  }
  if (pruned) _mfsSave();
})();

function delayedMoves(rawMoves, gid, board) {
  const now = Date.now();
  const prefix = gid + '-' + board + '-';
  const sans = (rawMoves || []).map(mv =>
    typeof mv === 'string' ? mv.split(' ')[0] : (mv.m || mv.san || '')
  ).filter(Boolean);
  let changed = false;
  sans.forEach((_, i) => {
    const k = prefix + i;
    if (!moveFirstSeen[k]) { moveFirstSeen[k] = now; changed = true; }
  });
  if (changed) _mfsSave();
  return DELAY_MS > 0
    ? sans.filter((_, i) => now - moveFirstSeen[prefix + i] >= DELAY_MS)
    : sans;
}

function extractClocks(data) {
  if (!data || !data.moves || !data.moves.length) return null;
  const moves = data.moves;
  let wSecs = null, bSecs = null;
  moves.forEach((mv, i) => {
    const str = typeof mv === 'string' ? mv : (mv.m || mv.san || '');
    const parts = str.split(' ');
    const t = parseInt(parts[1], 10);
    if (!isNaN(t) && t >= 0) {
      if (i % 2 === 0) wSecs = t;
      else bSecs = t;
    }
  });
  if (wSecs === null && bSecs === null) return null;
  const whoseTurn = moves.length % 2 === 0 ? 'w' : 'b';
  return { wSecs, bSecs, whoseTurn };
}

function fmtClock(secs) {
  if (secs === null || secs === undefined || secs < 0) secs = 0;
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

const SWE = { K:'K', Q:'D', R:'T', B:'L', N:'S' };

// ── Stockfish (enkelbräde-läge) ──────────────────────────────────────
let sfWorker = null, sfReady = false, sfOn = false, sfPending = null;

function sfInit() {
  if (sfWorker) return;
  try {
    const blob = new Blob(
      [`importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')`],
      { type: 'application/javascript' }
    );
    sfWorker = new Worker(URL.createObjectURL(blob));
    sfWorker.onmessage = sfMsg;
    sfWorker.postMessage('uci');
  } catch(e) { console.warn('Stockfish misslyckades:', e); }
}

function sfMsg(e) {
  const line = e.data;
  if (line === 'uciok') { sfReady = true; sfWorker.postMessage('isready'); }
  if (line === 'readyok' && sfPending) {
    const fen = sfPending; sfPending = null;
    sfCurrentFen = fen;
    sfWorker.postMessage(`position fen ${fen}`);
    sfWorker.postMessage('go movetime 3000');
  }

  if (line.startsWith('info') && line.includes(' score ')) {
    const cpM = line.match(/score cp (-?\d+)/);
    const mateM = line.match(/score mate (-?\d+)/);
    const pvM = line.match(/ pv (.+)/);
    let score = null, isMate = false;
    if (mateM) { score = parseInt(mateM[1]); isMate = true; }
    else if (cpM) score = parseInt(cpM[1]) / 100;

    if (score !== null) {
      const barEl = document.getElementById('sf-vert-fill');
      const pvEl  = document.getElementById('sf-pv');

      // Stockfish rapporterar från sidans-att-röra-sig perspektiv.
      // Vi vill alltid ha vitts perspektiv: om svart är att röra sig, flippa tecknet.
      const isBlackTurn = sfCurrentFen && sfCurrentFen.split(' ')[1] === 'b';
      const whitePov = isBlackTurn ? -score : score;

      // Evalvärde (alltid från vitts håll: + = vit bättre, - = svart bättre)
      let label;
      if (isMate) {
        label = whitePov > 0 ? `+#${Math.abs(score)}` : `-#${Math.abs(score)}`;
      } else {
        label = whitePov > 0 ? `+${whitePov.toFixed(2)}` : whitePov.toFixed(2);
      }
      sfLastEval = label;

      // Stapel: 100 = full vit, 0 = full svart
      let pct = isMate ? (whitePov > 0 ? 100 : 0) : 50 + Math.min(Math.max(whitePov * 8, -48), 48);
      if (barEl) barEl.style.height = pct + '%';

      // Eval + drag på en rad
      if (pvEl && pvM) {
        const uciMoves = pvM[1].trim().split(' ');
        pvEl.textContent = pvLine(sfCurrentFen, uciMoves, label);
      }
    }
  }
}

let sfCurrentFen = null;

let sfLastEval = '';

function pvLine(fen, uciMoves, evalStr) {
  if (!fen || !uciMoves.length) return evalStr;
  try {
    const c = new Chess(fen);
    const parts = fen.split(' ');
    let moveNum = parseInt(parts[5]) || 1;
    let isBlack = parts[1] === 'b';
    let line = isBlack ? moveNum + '\u2026' : ''; // … om svart börjar

    for (const uci of uciMoves.slice(0, 14)) {
      const from = uci.slice(0,2), to = uci.slice(2,4), promo = uci[4];
      try {
        const m = c.move({ from, to, promotion: promo });
        if (!m) break;
        const san = sweSAN(m.san);
        if (!isBlack) { line += (line ? ' ' : '') + moveNum + '.' + san; }
        else           { line += ' ' + san; moveNum++; }
        isBlack = !isBlack;
      } catch(e) { break; }
    }
    return evalStr + '  ' + line;
  } catch(e) { return evalStr; }
}

function sfApplyUI() {
  const btn    = document.getElementById('sf-btn');
  const vBar   = document.getElementById('sf-vert-bar');
  const pvEl   = document.getElementById('sf-pv');
  if (!btn) return;
  if (sfOn) {
    btn.textContent = '⬛ Analys av'; btn.classList.add('on');
    vBar && vBar.classList.add('vis');
    pvEl && pvEl.classList.add('vis');
  } else {
    btn.textContent = '▶ Analys på'; btn.classList.remove('on');
    vBar && vBar.classList.remove('vis');
    pvEl && pvEl.classList.remove('vis');
  }
}

function sfAnalyze(fen) {
  if (!sfOn || !sfWorker) return;
  sfCurrentFen = fen;
  if (!sfReady) { sfPending = fen; return; }
  sfWorker.postMessage('stop');
  sfWorker.postMessage(`position fen ${fen}`);
  sfWorker.postMessage('go movetime 3000');
}

function sfToggle() {
  sfOn = !sfOn;
  sfApplyUI();
  if (sfOn) { sfInit(); sfRunNow(); }
  else if (sfWorker) sfWorker.postMessage('stop');
}

function sfRunNow() {
  if (!sfOn) return;
  sfAnalyze(ibC().fen());
}

const IB = {
  mains:   [],    // Spelets SAN-drag (från API)
  idx:     0,     // Vyposition i huvudlinje (0=start)
  varBase: -1,    // Idx i mains varianten utgår från (-1=i mains)
  varMvs:  [],    // Variantdrag (SAN) som visas just nu
  varIdx:  0,     // Hur långt in i varianten vi är
  allVars: {},    // Sparade varianter: { 'N': [SAN, SAN, ...] }
  selSq:   null,  // Markerat fält ('e2' etc.)
  inited:  false,
};

function ibC() {
  // Chess-instans vid aktuell vyposition
  const c = new Chess();
  for (let i = 0; i < IB.idx; i++) {
    try { c.move(IB.mains[i]); } catch(e) { break; }
  }
  if (IB.varBase >= 0 && IB.varIdx > 0) {
    for (let i = 0; i < IB.varIdx; i++) {
      try { c.move(IB.varMvs[i]); } catch(e) { break; }
    }
  }
  return c;
}

function ibSqN(sq) { return (8 - parseInt(sq[1])) * 8 + (sq.charCodeAt(0) - 97); }

function ibBoard() {
  try { _ibBoard(); } catch(e) { console.error('ibBoard:', e); }
}
function _ibBoard() {
  const el = document.querySelector('.single-board-grid');
  if (!el) return;
  const c = ibC();
  const legal = IB.selSq
    ? new Set(c.moves({ square: IB.selSq, verbose: true }).map(m => m.to))
    : new Set();
  const hist = c.history({ verbose: true });
  let lmF = -1, lmT = -1;
  if (hist.length) { lmF = ibSqN(hist.at(-1).from); lmT = ibSqN(hist.at(-1).to); }
  const pos = c.board();
  let h = '';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const idx = r * 8 + f;
    const sq  = String.fromCharCode(97 + f) + (8 - r);
    const li  = (r + f) % 2 === 0;
    const lm  = idx === lmF || idx === lmT;
    const sel = sq === IB.selSq;
    const leg = legal.has(sq);
    let cls = sel ? (li ? 'sel-li' : 'sel-da') : lm ? (li ? 'll' : 'ld') : (li ? 'li' : 'da');
    const p = pos[r][f];
    let inner = '';
    if (p) { const k = p.color + p.type.toUpperCase(); if (PIECE_SVG[k]) inner = `<img src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(PIECE_SVG[k])}" alt="${k}">`; }
    const dot  = (leg && !p) ? '<div class="ib-dot"></div>' : '';
    const cap  = (leg &&  p) ? ' ib-cap' : '';
    const canDrag = (p && p.color === c.turn())
      ? ` draggable="true" ondragstart="ibDragStart(event,'${sq}')" ondragend="ibDragEnd(event)"`
      : '';
    h += `<div class="sq ${cls}${cap}"${canDrag} onclick="ibClick('${sq}')" ondragover="event.preventDefault()" ondrop="ibDrop(event,'${sq}')">${inner}${dot}</div>`;
  }
  el.innerHTML = h;
}

function ibVarHTML(vk) {
  const vm = IB.allVars[vk];
  if (!vm || !vm.length) return '';
  // Spela upp huvudlinjen till greningspunkten för att få rätt dragnummer och tur
  const tmp = new Chess();
  const startIdx = parseInt(vk);
  for (let k = 0; k < startIdx && k < IB.mains.length; k++) {
    try { tmp.move(IB.mains[k]); } catch(e) { break; }
  }
  let moveNum = Math.floor(tmp.history().length / 2) + 1;
  let isBlack  = tmp.turn() === 'b';
  let h = '<div class="ib-var-line">(';
  vm.forEach((s, mi) => {
    const inV = String(IB.varBase) === vk && IB.varIdx === mi + 1;
    let prefix = '';
    if (!isBlack) {
      prefix = moveNum + '.';     // vitts drag → dragnummer + punkt
    } else if (mi === 0) {
      prefix = moveNum + '…';    // svarts första drag i varianten → "N…"
    }
    h += `<span class="ib-vm${inV ? ' ib-cur' : ''}" onclick="ibGoVar(${vk},${mi+1})">${prefix}${sweSAN(s)}</span>`;
    if (mi < vm.length - 1) h += ' ';
    isBlack = !isBlack;
    if (!isBlack) moveNum++;
  });
  return h + ')</div>';
}

function ibMoves() {
  const el = document.getElementById('single-ml');
  if (!el) return;
  if (!IB.mains.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:0.85em;padding:4px 0">Väntar på drag…</div>';
    return;
  }
  let html = '';
  html += ibVarHTML('0');  // variant från startposition
  for (let i = 0; i < IB.mains.length; i += 2) {
    const n    = i / 2 + 1;
    const wSan = sweSAN(IB.mains[i]);
    const bSan = IB.mains[i+1] ? sweSAN(IB.mains[i+1]) : '';
    const wCur = IB.varBase < 0 && IB.idx === i + 1;
    const bCur = IB.varBase < 0 && IB.idx === i + 2;
    html += `<div class="ib-row"><span class="ml-num">${n}.</span>`;
    html += `<span class="ib-w${wCur ? ' ib-cur' : ''}" onclick="ibGoto(${i+1})">${wSan}</span>`;
    html += bSan
      ? `<span class="ib-b${bCur ? ' ib-cur' : ''}" onclick="ibGoto(${i+2})">${bSan}</span>`
      : `<span class="ib-b"></span>`;
    html += `</div>`;
    html += ibVarHTML(String(i + 1));
    if (bSan) html += ibVarHTML(String(i + 2));
  }
  el.innerHTML = html;
  el.querySelector('.ib-cur')?.scrollIntoView({ block: 'nearest' });
}

function ibDragStart(e, sq) {
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', sq);
  IB.selSq = sq;
  // Använd bara pjäs-bilden som drag-ghost, inte hela rutan
  const img = e.currentTarget.querySelector('img');
  if (img) {
    const r = img.getBoundingClientRect();
    e.dataTransfer.setDragImage(img, r.width / 2, r.height / 2);
  }
  requestAnimationFrame(ibBoard);
}

function ibDrop(e, sq) {
  e.preventDefault();
  if (sq !== IB.selSq) ibClick(sq);
  else { IB.selSq = null; ibBoard(); }
}

function ibDragEnd(e) {
  if (e.dataTransfer.dropEffect === 'none') { IB.selSq = null; ibBoard(); }
}

function ibClick(sq) {
  const c = ibC();
  if (IB.selSq) {
    const move = c.moves({ square: IB.selSq, verbose: true }).find(m => m.to === sq);
    if (move) {
      const san = move.san;
      if (IB.varBase < 0 && IB.mains[IB.idx] === san) {
        // Matchar nästa huvuddrag → navigera framåt
        IB.idx++; IB.selSq = null; ibBoard(); ibMoves(); if (sfOn) sfRunNow(); ibUpdNav(); return;
      }
      // I slutet av (eller utan) huvudlinje → lägg till i IB.mains direkt
      if (IB.varBase < 0 && IB.idx >= IB.mains.length) {
        IB.mains.push(san);
        IB.idx++;
        IB.selSq = null; ibBoard(); ibMoves(); if (sfOn) sfRunNow(); ibUpdNav(); return;
      }
      // Avvikelse mitt i huvudlinjen → skapa/fortsätt variant
      if (IB.varBase < 0) {
        const vk = String(IB.idx);
        if (!IB.allVars[vk]) IB.allVars[vk] = [];
        IB.allVars[vk].push(san);
        IB.varBase = IB.idx;
        IB.varMvs  = IB.allVars[vk];
        IB.varIdx  = IB.allVars[vk].length;
      } else {
        const vk = String(IB.varBase);
        IB.allVars[vk].push(san);
        IB.varMvs = IB.allVars[vk];
        IB.varIdx++;
      }
      IB.selSq = null; ibBoard(); ibMoves(); if (sfOn) sfRunNow(); ibUpdNav(); return;
    }
    // Klick på egen pjäs → byt markering
    const pc = c.get(sq);
    if (pc && pc.color === c.turn()) { IB.selSq = sq; ibBoard(); return; }
    IB.selSq = null; ibBoard(); return;
  }
  const pc = c.get(sq);
  if (pc && pc.color === c.turn()) { IB.selSq = sq; ibBoard(); }
}

function ibGoto(n) {
  IB.idx = Math.max(0, Math.min(n, IB.mains.length));
  IB.varBase = -1; IB.varMvs = []; IB.varIdx = 0; IB.selSq = null;
  ibBoard(); ibMoves(); if (sfOn) sfRunNow();
  ibUpdNav();
}

function ibGoVar(base, sub) {
  IB.varBase = base;
  IB.varMvs  = IB.allVars[String(base)] || [];
  IB.varIdx  = Math.min(sub, IB.varMvs.length);
  IB.selSq   = null;
  ibBoard(); ibMoves(); if (sfOn) sfRunNow();
  ibUpdNav();
}

function ibFwd() {
  if (IB.varBase >= 0) {
    if (IB.varIdx < IB.varMvs.length) { IB.varIdx++; ibBoard(); ibMoves(); if (sfOn) sfRunNow(); ibUpdNav(); }
    return;
  }
  if (IB.idx < IB.mains.length) ibGoto(IB.idx + 1);
}

function ibBack() {
  if (IB.varBase >= 0) {
    IB.varIdx--;
    if (IB.varIdx <= 0) { IB.varBase = -1; IB.varMvs = []; IB.varIdx = 0; }
    IB.selSq = null; ibBoard(); ibMoves(); if (sfOn) sfRunNow(); ibUpdNav(); return;
  }
  if (IB.idx > 0) ibGoto(IB.idx - 1);
}

function ibStart() { ibGoto(0); }
function ibEnd()   { ibGoto(IB.mains.length); }

function ibUpdNav() {
  const atStart = IB.idx === 0 && IB.varBase < 0;
  const atEnd   = IB.varBase < 0 ? IB.idx >= IB.mains.length : IB.varIdx >= IB.varMvs.length;
  ['ib-btn-start','ib-btn-back'].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = atStart; });
  ['ib-btn-fwd','ib-btn-end'].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = atEnd; });
}

function ibSync(data) {
  const raw = data && data.moves ? data.moves : [];
  const newMains = delayedMoves(raw, SINGLE_GID + '-R' + DISPLAY_ROUND, SINGLE_BOARD);
  // Don't overwrite good data with empty data (e.g. if a fetch fails mid-game)
  if (newMains.length > 0 || IB.mains.length === 0) {
    const wasEnd = IB.idx === IB.mains.length;
    IB.mains = newMains;
    if (wasEnd) IB.idx = Math.min(IB.idx, IB.mains.length);
  }
  if (IB.inited) { ibBoard(); ibMoves(); ibUpdNav(); }
}

document.addEventListener('keydown', e => {
  if (!SINGLE_MODE) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); ibFwd(); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); ibBack(); }
  if (e.key === 'ArrowUp')    { e.preventDefault(); ibStart(); }
  if (e.key === 'ArrowDown')  { e.preventDefault(); ibEnd(); }
});

function sweSAN(san) {
  if (!san) return '';
  return san
    .replace(/^([KQRBN])/, m => SWE[m] || m)
    .replace(/=([KQRBN])/, (_, p) => '=' + (SWE[p] || p));
}

function moveListHTML(data, gid, board) {
  const rawMoves = data && data.moves ? data.moves : [];
  const sans = delayedMoves(rawMoves, gid, board);

  if (!sans.length) return '<div class="ml-row"><span class="ml-num">1.</span><span class="ml-w" style="color:var(--muted)">…</span><span class="ml-b"></span></div>';

  let rows = '';
  const totalPairs = Math.ceil(sans.length / 2);
  for (let i = 0; i < sans.length; i += 2) {
    const n   = Math.floor(i / 2) + 1;
    const w   = sweSAN(sans[i]);
    const b   = sweSAN(sans[i + 1] || '');
    const isLast = (i + 2 >= sans.length);
    rows += `<div class="ml-row${isLast ? ' ml-last' : ''}">` +
            `<span class="ml-num">${n}.</span>` +
            `<span class="ml-w">${w}</span>` +
            `<span class="ml-b">${b}</span></div>`;
  }
  return rows;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pLabel(p){ return p?([p.fname,p.lname].filter(Boolean).join(' ')||p.name||null):null; }
function sqIdx(sq){ return (8-parseInt(sq[1]))*8+(sq.charCodeAt(0)-97); }

function boardHTML(data, gid, board) {
  const c = new Chess(); let lmF=-1,lmT=-1;
  const dMoves = delayedMoves(data&&data.moves?data.moves:[], gid, board);
  for (const san of dMoves) {
    if(!san)break; try{c.move(san);}catch(e){break;}
  }
  const hist=c.history({verbose:true});
  if(hist.length){lmF=sqIdx(hist[hist.length-1].from);lmT=sqIdx(hist[hist.length-1].to);}
  const pos=c.board(); let h='';
  for(let dr=0;dr<8;dr++) for(let dc=0;dc<8;dc++){
    const idx=dr*8+dc,isLi=(dr+dc)%2===0,isLM=idx===lmF||idx===lmT;
    const cls=isLM?(isLi?'ll':'ld'):(isLi?'li':'da');
    const p=pos[dr][dc]; let inner='';
    if(p){const k=p.color+p.type.toUpperCase();if(PIECE_SVG[k])inner=`<img src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(PIECE_SVG[k])}" alt="${k}">`;}
    h+=`<div class="sq ${cls}">${inner}</div>`;
  }
  return `<div class="board-grid">${h}</div>`;
}

function initGrid() {
  if (SINGLE_MODE) {
    document.getElementById('grid').style.display = 'none';
    const grp = GROUPS.find(g => g.id === SINGLE_GID);
    const label = grp ? grp.label : SINGLE_GID;
    const wrap = document.createElement('div');
    wrap.className = 'single-wrap';
    wrap.id = 'single-wrap';
    wrap.innerHTML =
      `<div class="single-hdr">${esc(label)} — Bord ${SINGLE_BOARD}</div>` +
      `<div id="single-content" class="single-bw"></div>`;
    document.body.appendChild(wrap);
  } else {
    let html='';
    GROUPS.forEach(g=>{ html+=`<div class="g-hdr">${esc(g.label)}</div>`; });
    for(let b=1;b<=BOARDS;b++) GROUPS.forEach(g=>{ html+=`<div class="bc" id="bc-${g.id}-${b}"></div>`; });
    document.getElementById('grid').innerHTML=html;
  }
}

function updateBoard(g,b) {
  const el=document.getElementById(`bc-${g.id}-${b}`); if(!el)return;
  const data=(gameData[g.id]||{})[b];
  const pair=(pairData[g.id]||{})[b]||{};
  const w=pair.white||{},bl=pair.black||{};
  const wN=pLabel(w)||'Vit', bN=pLabel(bl)||'Svart';
  const wT=w.title?`<span class="p-title">${esc(w.title)}</span>`:'';
  const bT=bl.title?`<span class="p-title">${esc(bl.title)}</span>`:'';
  const res=data&&data.result&&data.result!=='*'?`<span class="bc-result">${esc(data.result)}</span>`:'';

  // Klockor: uppdatera fetchedAt bara vid nytt drag (annars blinkar de)
  const done = !!(data && data.result && data.result !== '*');
  const clks = extractClocks(data);
  if (!clockState[g.id]) clockState[g.id] = {};
  const showClocks = done || DELAY_MS === 0;
  if (clks && showClocks) {
    const prev = clockState[g.id][b];
    const moveCount = data && data.moves ? data.moves.length : 0;
    const newMove = !prev || !prev.fetchedAt || prev._moveCount !== moveCount;
    clockState[g.id][b] = { ...clks, _moveCount: moveCount,
      fetchedAt: newMove ? Date.now() : prev.fetchedAt, done };
  } else {
    clockState[g.id][b] = { done };
  }

  el.innerHTML=
    `<div class="bc-hdr"><span class="bc-num">Bord ${b}</span>${res}</div>` +
    `<div class="bc-player">${bT}<span class="p-dot b"></span><span class="bc-player-name">${esc(bN)}</span><span class="bc-player-rating">${bl.rating||''}</span><span class="p-clock" id="clk-${g.id}-${b}-b"></span></div>` +
    `<div class="bw">${boardHTML(data,g.id,b)}<div class="ml" id="ml-${g.id}-${b}">${moveListHTML(data,g.id,b)}</div></div>` +
    `<div class="bc-player">${wT}<span class="p-dot w"></span><span class="bc-player-name">${esc(wN)}</span><span class="bc-player-rating">${w.rating||''}</span><span class="p-clock" id="clk-${g.id}-${b}-w"></span></div>`;
  const mlEl=document.getElementById(`ml-${g.id}-${b}`);
  if(mlEl) mlEl.scrollTop=mlEl.scrollHeight;
}

function renderSingle() {
  const grp = GROUPS.find(g => g.id === SINGLE_GID);
  if (!grp) return;
  const data = (gameData[SINGLE_GID] || {})[SINGLE_BOARD];
  const pair = (pairData[SINGLE_GID] || {})[SINGLE_BOARD] || {};
  const w = pair.white || {}, bl = pair.black || {};
  const wN = pLabel(w) || 'Vit', bN = pLabel(bl) || 'Svart';
  const wT = w.title  ? `<span class="single-p-title">${esc(w.title)}</span>`  : '';
  const bT = bl.title ? `<span class="single-p-title">${esc(bl.title)}</span>` : '';
  const res = data && data.result && data.result !== '*'
    ? `<span class="single-result">${esc(data.result)}</span>` : '';

  // Klockstatus (dölj klockor för pågående partier när fördröjning är aktiv)
  const done = !!(data && data.result && data.result !== '*');
  const clks = extractClocks(data);
  if (!clockState[SINGLE_GID]) clockState[SINGLE_GID] = {};
  const showClocks = done || DELAY_MS === 0;
  if (clks && showClocks) {
    const prev = (clockState[SINGLE_GID] || {})[SINGLE_BOARD];
    const moveCount = data && data.moves ? data.moves.length : 0;
    const newMove = !prev || !prev.fetchedAt || prev._moveCount !== moveCount;
    clockState[SINGLE_GID][SINGLE_BOARD] = { ...clks, _moveCount: moveCount,
      fetchedAt: newMove ? Date.now() : prev.fetchedAt, done };
  } else {
    clockState[SINGLE_GID][SINGLE_BOARD] = { done };
  }

  const content = document.getElementById('single-content');
  if (!content) return;

  // ── Redan initierad: uppdatera bara speldata via IB ─────────────────
  if (IB.inited) {
    ibSync(data);
    sfApplyUI();
    return;
  }

  // ── Första render: bygg hela strukturen ──────────────────────────────────
  content.innerHTML =
    `<div class="board-stack">` +
    `<div class="sf-vert-bar" id="sf-vert-bar"><div class="sf-vert-fill" id="sf-vert-fill"></div></div>` +
    `<div class="single-board-grid"></div>` +
    `</div>` +
    `<div class="single-ml-col">
      <div class="single-players">
        <div class="single-p-row"><span class="single-p-dot w"></span>${wT}<span>${esc(wN)}</span><span class="single-p-rating">${w.rating||''}</span><span class="p-clock" style="font-size:1em;margin-left:8px" id="clk-${SINGLE_GID}-${SINGLE_BOARD}-w"></span>${res}</div>
        <div class="single-p-row"><span class="single-p-dot b"></span>${bT}<span>${esc(bN)}</span><span class="single-p-rating">${bl.rating||''}</span><span class="p-clock" style="font-size:1em;margin-left:8px" id="clk-${SINGLE_GID}-${SINGLE_BOARD}-b"></span></div>
      </div>
      <div class="single-ml" id="single-ml"></div>
      <div class="sf-row">
        <div class="ib-nav">
          <button class="ib-nav-btn" id="ib-btn-start" onclick="ibStart()" title="Början (↑)">⏮</button>
          <button class="ib-nav-btn" id="ib-btn-back"  onclick="ibBack()"  title="Föregående (←)">◀</button>
          <button class="ib-nav-btn" id="ib-btn-fwd"   onclick="ibFwd()"   title="Nästa (→)">▶</button>
          <button class="ib-nav-btn" id="ib-btn-end"   onclick="ibEnd()"   title="Slutet (↓)">⏭</button>
        </div>
        <button class="sf-btn" id="sf-btn" onclick="sfToggle()">▶ Analys på</button>
      </div>
      <div class="sf-pv" id="sf-pv"></div>
    </div>`;

  IB.inited = true;
  ibSync(data);
  ibEnd(); // börja vid senaste draget
  ibUpdNav();
}


async function fetchGroup(g) {
  if(!gameData[g.id])gameData[g.id]={};
  if(!pairData[g.id])pairData[g.id]={};
  try{const r=await fetchFresh(`${BASE}/${g.tid}/round-${DISPLAY_ROUND}/index.json`);
    if(r.ok){const idx=await r.json();(idx.pairings||[]).forEach((p,i)=>{if(i<BOARDS)pairData[g.id][i+1]=p;});}}catch(e){}
  for(let b=1;b<=BOARDS;b++){
    try{const r=await fetchFresh(`${BASE}/${g.tid}/round-${DISPLAY_ROUND}/game-${b}.json`);
      if(r.ok)gameData[g.id][b]=await r.json();}catch(e){}
  }
}

function setDisplayRound(rn, btn) {
  DISPLAY_ROUND = rn;
  localStorage.setItem('ucf_display_round', rn);
  document.querySelectorAll('.drd-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  gameData = {}; pairData = {};
  if (SINGLE_MODE) { IB.mains = []; IB.idx = 0; IB.inited = false; }
  poll();
}

async function poll(){
  if (SINGLE_MODE) {
    const grp = GROUPS.find(g => g.id === SINGLE_GID);
    if (grp) await fetchGroup(grp);
    renderSingle();
  } else {
    await Promise.all(GROUPS.map(fetchGroup));
    GROUPS.forEach(g=>{for(let b=1;b<=BOARDS;b++)updateBoard(g,b);});
  }
  setTimeout(poll, SINGLE_MODE ? 3000 : 3000);
}

function tick(){
  const n=new Date();
  document.getElementById('clock').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}

function tickClocks() {
  const now = Date.now();
  for (const gid of Object.keys(clockState)) {
    for (const b of Object.keys(clockState[gid])) {
      const cs = clockState[gid][b];
      if (!cs || !cs.fetchedAt) continue;
      const elapsed = (now - cs.fetchedAt) / 1000;
      const wEl = document.getElementById(`clk-${gid}-${b}-w`);
      const bEl = document.getElementById(`clk-${gid}-${b}-b`);
      if (!wEl && !bEl) continue;

      if (cs.done) {
        if (wEl) { wEl.textContent = cs.wSecs !== null && cs.wSecs !== undefined ? fmtClock(cs.wSecs) : ''; wEl.className='p-clock'; }
        if (bEl) { bEl.textContent = cs.bSecs !== null && cs.bSecs !== undefined ? fmtClock(cs.bSecs) : ''; bEl.className='p-clock'; }
        continue;
      }

      let wSecs = cs.wSecs, bSecs = cs.bSecs;
      if (cs.whoseTurn === 'w' && wSecs !== null) wSecs = Math.max(0, wSecs - elapsed);
      if (cs.whoseTurn === 'b' && bSecs !== null) bSecs = Math.max(0, bSecs - elapsed);

      if (wEl) {
        wEl.textContent = wSecs !== null ? fmtClock(wSecs) : '';
        wEl.className = 'p-clock' + (cs.whoseTurn==='w' && wSecs !== null ? (wSecs<30?' low':' active') : '');
      }
      if (bEl) {
        bEl.textContent = bSecs !== null ? fmtClock(bSecs) : '';
        bEl.className = 'p-clock' + (cs.whoseTurn==='b' && bSecs !== null ? (bSecs<30?' low':' active') : '');
      }
    }
  }
}

initGrid(); tick(); setInterval(tick,10000); setInterval(tickClocks,1000); poll();
</script>
