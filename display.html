<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uppsala Schackfestival 2026 — Live Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --light-sq: #e8c870;
      --dark-sq:  #4a7ec4;
      --lm-light: #f0d838;
      --lm-dark:  #5c9ee8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1b2e;
      color: #eee;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 14px 20px;
      background: rgba(13,26,46,0.98);
      border-bottom: 2px solid rgba(245,203,107,0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hdr-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.7rem;
      color: #f5cb6b;
      letter-spacing: 0.07em;
    }
    .live-dot {
      display: inline-block;
      width: 9px; height: 9px;
      background: #e74c3c;
      border-radius: 50%;
      animation: pulse 1.4s infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.25} }
    .hdr-time {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.45);
      font-variant-numeric: tabular-nums;
      min-width: 60px;
      text-align: right;
    }

    .groups {
      max-width: 1440px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .group {
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      border: 1px solid rgba(245,203,107,0.13);
      overflow: hidden;
    }
    .group-header {
      background: rgba(13,58,110,0.55);
      padding: 7px 16px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      color: #f5cb6b;
      letter-spacing: 0.07em;
    }
    .boards-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }
    .board-card {
      padding: 12px;
      border-right: 1px solid rgba(255,255,255,0.07);
    }
    .board-card:last-child { border-right: none; }
    .board-card-hdr {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.35);
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .result-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: #f5cb6b;
      background: rgba(192,112,16,0.25);
      padding: 1px 7px;
      border-radius: 4px;
    }
    .player-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 4px;
    }
    .color-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .color-dot.w { background: #f5f5f5; border: 1px solid #777; }
    .color-dot.b { background: #1a1a1a; border: 1px solid #555; }
    .player-name-text {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .player-rating {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      flex-shrink: 0;
    }
    .title-badge {
      font-size: 0.65rem;
      font-weight: 700;
      color: #f5cb6b;
      background: rgba(245,203,107,0.15);
      padding: 1px 4px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .board-wrap { margin-top: 8px; }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      aspect-ratio: 1 / 1;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.5);
    }
    .sq {
      display: flex; align-items: center; justify-content: center;
    }
    .sq.light   { background: var(--light-sq); }
    .sq.dark    { background: var(--dark-sq);  }
    .sq.lm-l    { background: var(--lm-light); }
    .sq.lm-d    { background: var(--lm-dark);  }
    .sq img {
      width: 82%; height: 82%;
      pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.55));
    }
  </style>
</head>
<body>

<header>
  <div></div>
  <div class="hdr-title"><span class="live-dot"></span>Uppsala Schackfestival 2026</div>
  <div class="hdr-time" id="hdr-clock">--:--</div>
</header>

<div class="groups" id="groups"></div>

let gameData = {};
let pairData = {};

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function playerLabel(p) {
  if (!p) return null;
  return [p.fname, p.lname].filter(Boolean).join(' ') || p.name || null;
}

function sqIdx(sq) {
  return (8 - parseInt(sq[1])) * 8 + (sq.charCodeAt(0) - 97);
}

function boardHTML(data) {
  const c = new Chess();
  let lmFrom = -1, lmTo = -1;
  for (const mv of (data && data.moves ? data.moves : [])) {
    const san = typeof mv === 'string' ? mv.split(' ')[0] : (mv.m || mv.san || '');
    if (!san) break;
    try { c.move(san); } catch(e) { break; }
  }
  const hist = c.history({ verbose: true });
  if (hist.length) {
    lmFrom = sqIdx(hist[hist.length-1].from);
    lmTo   = sqIdx(hist[hist.length-1].to);
  }
  const pos = c.board();
  let html = '<div class="board-grid">';
  for (let dr = 0; dr < 8; dr++) {
    for (let dc = 0; dc < 8; dc++) {
      const idx = dr * 8 + dc;
      const isLight = (dr + dc) % 2 === 0;
      const isLM    = idx === lmFrom || idx === lmTo;
      const cls = isLM ? (isLight ? 'lm-l' : 'lm-d') : (isLight ? 'light' : 'dark');
      const piece = pos[dr][dc];
      let inner = '';
      if (piece) {
        const key = piece.color + piece.type.toUpperCase();
        if (PIECE_SVG[key]) {
          inner = `<img src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(PIECE_SVG[key])}" alt="${key}">`;
        }
      }
      html += `<div class="sq ${cls}">${inner}</div>`;
    }
  }
  return html + '</div>';
}

function render() {
  let html = '';
  GROUPS.forEach(grp => {
    html += `<div class="group">
      <div class="group-header">${escHtml(grp.label)}</div>
      <div class="boards-row">`;
    for (let b = 1; b <= grp.boards; b++) {
      const data = (gameData[grp.id] || {})[b];
      const pair = (pairData[grp.id] || {})[b] || {};
      const w = pair.white || {};
      const bl = pair.black || {};
      const wName = playerLabel(w) || 'Vit';
      const bName = playerLabel(bl) || 'Svart';
      const wTitle = w.title ? `<span class="title-badge">${escHtml(w.title)}</span>` : '';
      const bTitle = bl.title ? `<span class="title-badge">${escHtml(bl.title)}</span>` : '';
      const wRating = w.rating ? `<span class="player-rating">${w.rating}</span>` : '';
      const bRating = bl.rating ? `<span class="player-rating">${bl.rating}</span>` : '';
      const result = data && data.result && data.result !== '*'
        ? `<span class="result-badge">${escHtml(data.result)}</span>` : '';
      html += `<div class="board-card">
        <div class="board-card-hdr"><span>Bord ${b}</span>${result}</div>
        <div class="player-row">
          <span class="color-dot w"></span>
          ${wTitle}
          <span class="player-name-text">${escHtml(wName)}</span>
          ${wRating}
        </div>
        <div class="player-row">
          <span class="color-dot b"></span>
          ${bTitle}
          <span class="player-name-text">${escHtml(bName)}</span>
          ${bRating}
        </div>
        <div class="board-wrap">${boardHTML(data)}</div>
      </div>`;
    }
    html += '</div></div>';
  });
  document.getElementById('groups').innerHTML = html;
}

async function fetchGroup(grp) {
  if (!gameData[grp.id]) gameData[grp.id] = {};
  if (!pairData[grp.id]) pairData[grp.id] = {};
  try {
    const r = await fetch(`${BASE}/${grp.tid}/round-1/index.json`, { cache:'no-store' });
    if (r.ok) {
      const idx = await r.json();
      (idx.pairings || []).forEach((p, i) => {
        if (i < grp.boards) pairData[grp.id][i + 1] = p;
      });
    }
  } catch(e) {}
  for (let b = 1; b <= grp.boards; b++) {
    try {
      const r = await fetch(`${BASE}/${grp.tid}/round-1/game-${b}.json`, { cache:'no-store' });
      if (r.ok) gameData[grp.id][b] = await r.json();
    } catch(e) {}
  }
}

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('hdr-clock').textContent = `${h}:${m}`;
}

async function poll() {
  await Promise.all(GROUPS.map(fetchGroup));
  render();
  setTimeout(poll, 3000);
}

updateClock();
setInterval(updateClock, 10000);
