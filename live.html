// Bygg mini-bräde från spelets slutposition med samma SVG-pjäser som huvudbrädet
function miniBoardHTML(data) {
  if (!data || typeof Chess === 'undefined') {
    return '<div class="mini-loading"><div class="spinner"></div></div>';
  }
  const c = new Chess();
  for (const mv of (data.moves || [])) {
    const san = typeof mv === 'string' ? mv.split(' ')[0] : (mv.m || mv.san || '');
    if (!san) break;
    try { c.move(san); } catch(e) { break; }
  }
  const pos = c.board();
  let html = '<div class="mini-board">';
  for (let dr = 0; dr < 8; dr++) {
    for (let dc = 0; dc < 8; dc++) {
      const isLight = (dr + dc) % 2 === 0;
      const piece = pos[dr][dc];
      let inner = '';
      if (piece) {
        const key = piece.color + piece.type.toUpperCase();
        if (PIECE_SVG[key]) {
          inner = `<img src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(PIECE_SVG[key])}" alt="${key}">`;
        }
      }
      html += `<div class="mini-sq ${isLight ? 'light' : 'dark'}">${inner}</div>`;
    }
  }
  html += '</div>';
  return html;
}

// Rendera 4×2-grid med alla bräden
function renderOverview() {
  if (!overviewMode) { renderAll(); return; }

  const boards = [...selectedBoards].sort((a, b) => a - b);
  const n    = boards.length;
  const cols = n <= 2 ? 2 : n <= 4 ? 2 : n <= 6 ? 3 : 4;

  const panels = boards.map(g => {
    const data  = overviewData[g];
    const km    = overviewKeyMap[g];  // finns vid schema-läge
    const p     = km ? overviewPairBySlot[g] : overviewPairings[g - 1];
    const slotLabel = km ? km.label : `B${g}`;
    const wName = p ? (p.white ? playerLabel(p.white) || '?' : '?') : '?';
    const bName = p ? (p.black ? playerLabel(p.black) || '?' : '?') : '?';

    let resText = '', resCls = '';
    if (data) {
      const norm   = normalizeResult(data.result);
      const isLive = data.live === true && (!norm || norm === '*');
      if (isLive)               { resText = '● LIVE'; resCls = 'live'; }
      else if (norm && norm !== '*') { resText = resultLabel(norm); resCls = 'done'; }
      else if ((data.moves||[]).length) resText = `${(data.moves||[]).length} drag`;
    }

    const norm   = data ? normalizeResult(data.result) : null;
    const isDone = norm && norm !== '*';
    const mbOverlay = isDone
      ? `<div class="mb-result-overlay"><span class="mb-result-text">${resultLabel(norm)}</span></div>`
      : '';
    const boardHTML = data
      ? mbBoardHTML(data)
      : '<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div>';

    const ev = ovEvalData[g];
    let wPct = 50;
    if (ev) {
      const normV = ev.btm ? -ev.value : ev.value;
      wPct = ev.type === 'mate' ? (normV > 0 ? 95 : 5) : 50 + 50 * Math.tanh(normV / 400);
    }
    const bPct = 100 - wPct;
    const evalOffCls = ovEvalEnabled ? '' : ' eval-off';

    return `<div class="mb-panel${g === GAME ? ' mb-cur' : ''}" onclick="focusBoard(${g})">
      <div class="mb-top">
        <div class="mb-top-row1">
          <span class="mb-board-num">${slotLabel}</span>
          ${resText ? `<span class="mb-res ${resCls}">${resText}</span>` : ''}
        </div>
        <span class="mb-player-w">⬜ ${escHtml(wName)}</span>
        <span class="mb-player-b">⬛ ${escHtml(bName)}</span>
      </div>
      <div class="mb-board-wrap">${boardHTML}${mbOverlay}</div>
      <div class="mb-eval-bar${evalOffCls}" id="mb-eval-${g}">
        <div class="mb-eval-w" style="flex-grow:${wPct.toFixed(1)}"></div>
        <div class="mb-eval-b" style="flex-grow:${bPct.toFixed(1)}"></div>
      </div>
    </div>`;
  }).join('');

  const listContent = pgnMode
    ? `<div id="pgn-games-widget">${pgnSidePanelHTML()}</div>`
    : `<div id="schedule-widget">${tournamentType === 'team' ? teamBoardListHTML() : scheduleHTML()}</div>`;

  document.getElementById('main').innerHTML =
    `<div style="flex:1;min-width:0;overflow:hidden">
       <div class="mb-grid mb-cols-${cols}">${panels}</div>
     </div>
     <div class="side-panel">
       <div id="engine-panel-wrap">${enginePanelHTML()}</div>
       <div id="side-list-wrap" style="flex:1;overflow-y:auto;min-height:0">${listContent}</div>
     </div>`;
}

// Hämta data för valda bräden i vald runda
async function fetchOverviewData() {
  if (!overviewMode) return;

  // Hämta pairings (behövs för spelarnamn)
  try {
    const idxR = await fetchFresh(`${BASE}/${TID}/round-${ROUND}/index.json`);
    if (idxR.ok) {
      const idxData = await idxR.json();
      overviewPairings = idxData.pairings || [];
    }
  } catch(e) {}

  // Hämta bara valda bräden parallellt
  const boards = [...selectedBoards];
  const results = await Promise.all(
    boards.map(g =>
      fetchFresh(`${BASE}/${TID}/round-${ROUND}/game-${g}.json`)
        .then(r => r.ok ? r.json() : null)
        .catch(() => null)
    )
  );
  boards.forEach((g, i) => { if (results[i]) overviewData[g] = results[i]; });

  if (overviewMode) {
    renderOverview();
    renderBoardSelector(); // uppdatera statusdottar
  }
}

// ── Overview Stockfish round-robin ────────────────────────────
// Analyserar ett bräde i taget till djup 12, cyklar genom 1–8.
// Uppdaterar eval-baren direkt i DOM utan omritning.

function analyzeNextOverviewBoard() {
  if (!overviewMode || !sfWorker || !sfReady) return;

  const boards = Object.keys(overviewData).map(Number).sort((a, b) => a - b);
  if (!boards.length) return;

  // Välj nästa bräde i cykeln
  const idx = boards.indexOf(ovCurrentBoard);
  ovCurrentBoard = boards[(idx + 1) % boards.length];

  const data = overviewData[ovCurrentBoard];
  if (!data || !(data.moves || []).length) {
    // Inga drag än – hoppa vidare direkt
    setTimeout(analyzeNextOverviewBoard, 200);
    return;
  }

  // Bygg positionen
  const c = new Chess();
  for (const mv of (data.moves || [])) {
    const san = typeof mv === 'string' ? mv.split(' ')[0] : (mv.m || mv.san || '');
    if (!san) break;
    try { c.move(san); } catch(e) { break; }
  }
  ovCurrentBlackToMove = c.turn() === 'b';
  const fen = c.fen();
  sfCurrentFen = fen;

  sfSearching = true;
  sfWorker.postMessage('setoption name MultiPV value 1');
  sfWorker.postMessage('position fen ' + fen);
  sfWorker.postMessage('go depth 12');
}

function updateOverviewEvalBar(g, ev) {
  let wPct;
  if (ev.type === 'mate') {
    const normV = ev.btm ? -ev.value : ev.value;
    wPct = normV > 0 ? 95 : 5;
  } else {
    const normV = ev.btm ? -ev.value : ev.value;
    wPct = 50 + 50 * Math.tanh(normV / 400);
  }
  const bPct = 100 - wPct;
  // Stöder både ny multi-vy (mb-eval) och gammal mini-vy
  const bar = document.getElementById('mb-eval-' + g) || document.getElementById('mini-eval-' + g);
  if (!bar) return;
  const wEl = bar.querySelector('.mb-eval-w') || bar.querySelector('.mini-eval-white');
  const bEl = bar.querySelector('.mb-eval-b') || bar.querySelector('.mini-eval-black');
  if (wEl) wEl.style.flexGrow = wPct.toFixed(1);
  if (bEl) bEl.style.flexGrow = bPct.toFixed(1);
}

// Toggla Stockfish-eval i multi-vy
function toggleOvEval() {
  ovEvalEnabled = !ovEvalEnabled;
  renderBoardSelector(); // uppdaterar knapptexten
  // Uppdatera eval-bar-opacitet direkt i DOM utan omritning
  document.querySelectorAll('.mb-eval-bar').forEach(el =>
    el.classList.toggle('eval-off', !ovEvalEnabled)
  );
  if (ovEvalEnabled) startOverviewAnalysis();
  else stopOverviewAnalysis();
}

function startOverviewAnalysis() {
  if (!sfWorker) {
    // Initiera SF tyst — analysen startar från readyok-handlern
    initStockfish();
    return;
  }
  if (!sfReady) return; // väntar på readyok
  if (sfSearching) { sfWorker.postMessage('stop'); return; } // bestmove triggar nästa
  ovCurrentBoard = null;
  analyzeNextOverviewBoard();
}

function stopOverviewAnalysis() {
  if (sfWorker && sfSearching) sfWorker.postMessage('stop');
  ovCurrentBoard = null;
}

function startOverviewPolling() {
  fetchOverviewData();
  overviewPollTimer = setInterval(fetchOverviewData, 5000);
}

function stopOverviewPolling() {
  if (overviewPollTimer) { clearInterval(overviewPollTimer); overviewPollTimer = null; }
}

async function fetchTeamPairings() {

function startTeamPolling() {

// Navigera till ett bräde via lagmatch-panelen
function switchToTeamBoard(g) {
  if (g === GAME && gameData) return;
  GAME = g;
  selectedBoards = new Set([g]);
  gameData = null; pairing = null; viewPly = 0; sfEval = null;

    overviewMode = false;
    stopOverviewPolling();
    stopOverviewAnalysis();
    overviewData = {};
  }
  if (clockTimer) clearInterval(clockTimer);

// ── Lagmatch: färgordning per bräde ──────────────────────────
// Returnerar true om lag 1 spelar svart på bräde g
function team1IsBlackOn(g) {
  const board1Black = (team1Board1Color === 'black');
  const isOdd = (g % 2 === 1);
  return board1Black ? isOdd : !isOdd;
}

// ── Lagmatch: högerkolumn ─────────────────────────────────────
function teamBoardListHTML() {
  if (!overviewPairings.length) return '';

  // Beräkna lagresultat (lag 1 = hemmalag)
  let s1 = 0, s2 = 0, counted = 0;
  overviewPairings.forEach((p, i) => {
    const g = i + 1;
    const r = normalizeResult(p.result);
    const t1black = team1IsBlackOn(g);
    if (r === '1-0')         { if (t1black) s2 += 1; else s1 += 1; counted++; }
    else if (r === '0-1')    { if (t1black) s1 += 1; else s2 += 1; counted++; }
    else if (r === '1/2-1/2') { s1 += 0.5; s2 += 0.5; counted++; }
  });

  const headLabel = (teamName1 && teamName2)
    ? `${teamName1} – ${teamName2}`
    : 'LAGMATCH';
  const scoreStr = counted > 0 ? `${fmtScore(s1)}–${fmtScore(s2)}` : '';

  const rows = overviewPairings.map((p, i) => {
    const g        = i + 1;
    const isActive = g === GAME;
    const isChecked = teamCheckedBoards.has(g);
    const t1black  = team1IsBlackOn(g);

    // Hemmalag alltid till vänster
    const leftP  = t1black ? p.black : p.white;
    const rightP = t1black ? p.white : p.black;
    const leftName  = leftP  ? playerLabel(leftP)  : '?';
    const rightName = rightP ? playerLabel(rightP) : '?';

    const r      = normalizeResult(p.result);
    const isLive = p.live === true && (!r || r === '*');
    const isDone = r && r !== '*';

    // Resultat från lag 1:s perspektiv (vänster spelare)
    let resText, resCls;
    if (isLive)       { resText = '●';  resCls = 'live'; }
    else if (!isDone) { resText = '–';  resCls = 'upcoming'; }
    else {
      const t1wins = (t1black && r === '0-1') || (!t1black && r === '1-0');
      const draw   = r === '1/2-1/2';
      resText = draw ? '½-½' : r;   // visa schacknotering: 1-0, 0-1, ½-½
      resCls  = draw ? 'done' : (t1wins ? 'done' : 'upcoming');
    }

    return `<div class="schedule-row${isActive ? ' active' : ''}"
        onclick="switchToTeamBoard(${g})" style="cursor:pointer">
      <span class="sch-num" style="min-width:24px;font-size:0.78rem;font-family:'Bebas Neue',sans-serif">B${g}</span>
      <span class="sch-players" style="font-size:0.82rem">${escHtml(leftName)} – ${escHtml(rightName)}</span>
      <span class="sch-result ${resCls}" style="margin-left:4px;font-size:0.9rem">${resText}</span>
      <input type="checkbox" class="sch-cb" ${isChecked ? 'checked' : ''}
        onclick="toggleTeamCheck(${g},event)" title="Markera bräde">
    </div>`;
  }).join('');

  // Åtgärdsrad när bräden är bocade
  const n = teamCheckedBoards.size;
  const actionBar = n > 0 ? `<div class="team-action-bar">
    <button class="team-act-btn pgn" onclick="downloadTeamBoardsPGN()">⬇ PGN (${n})</button>
    ${n >= 2 ? `<button class="team-act-btn multi" onclick="activateTeamMultiView()">⊞ Visa ${n} bräden</button>` : ''}
  </div>` : '';

  return `<div class="panel-box">
    <div class="panel-head" style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px">
      <span style="font-size:0.78rem">${escHtml(headLabel)}</span>
      ${scoreStr ? `<span style="color:var(--accent);font-size:1rem;letter-spacing:.04em">${scoreStr}</span>` : ''}
    </div>
    ${rows}
    ${actionBar}
  </div>`;
}

// ── Lagmatch: kryssruta togglad ───────────────────────────────
function toggleTeamCheck(g, event) {
  event.stopPropagation(); // förhindra radklick
  if (teamCheckedBoards.has(g)) teamCheckedBoards.delete(g);
  else teamCheckedBoards.add(g);
  renderScheduleWidget();
}

// ── Lagmatch: aktivera multi-vy med valda bräden ──────────────
function activateTeamMultiView() {
  if (teamCheckedBoards.size < 2) return;
  selectedBoards = new Set(teamCheckedBoards);
  if (!overviewMode) {
    overviewMode = true;
    if (pollTimer)  clearTimeout(pollTimer);
    if (clockTimer) clearInterval(clockTimer);
    ovEvalData = {};
    ovEvalEnabled = sfEnabled; // synka med motor-inställningen
  }
  renderBoardSelector();
  startOverviewPolling();
  if (ovEvalEnabled) startOverviewAnalysis();
}

// ── Schema-multivy: aktivera för match/roundrobin/swiss ──────────
function activateScheduleMultiView() {
  if (selectedPGNRounds.size < 2) return;
  const isSwiss = tournamentType === 'swiss';

  // Bygg keyMap: slot → {round, board, label}
  overviewKeyMap    = {};
  overviewPairBySlot = {};
  overviewData      = {};
  ovEvalData        = {};

  const sortedKeys = [...selectedPGNRounds].sort((a, b) => {
    const [ra, ba] = a.split('-').map(Number);
    const [rb, bb] = b.split('-').map(Number);
    return ra !== rb ? ra - rb : ((ba||1) - (bb||1));
  });

  selectedBoards = new Set();
  sortedKeys.forEach((key, i) => {
    const slot = i + 1;
    const parts = key.split('-').map(Number);
    const round = parts[0];
    const board = parts[1] || 1;
    const label = isSwiss ? `R${round}·B${board}` : `R${round}`;
    overviewKeyMap[slot] = { round, board, label };
    selectedBoards.add(slot);
  });

  overviewMode  = true;
  ovEvalEnabled = sfEnabled;
  if (pollTimer)  clearTimeout(pollTimer);
  if (clockTimer) clearInterval(clockTimer);

  renderBoardSelector();
  fetchOverviewDataSchedule();
  if (ovEvalEnabled) startOverviewAnalysis();
}

async function fetchOverviewDataSchedule() {
  if (!overviewMode) return;
  const slots = [...selectedBoards].sort((a, b) => a - b);
  await Promise.all(slots.map(async slot => {
    const km = overviewKeyMap[slot];
    if (!km) return;
    try {
      const [gameR, idxR] = await Promise.all([
        fetchFresh(`${BASE}/${TID}/round-${km.round}/game-${km.board}.json`),
        fetchFresh(`${BASE}/${TID}/round-${km.round}/index.json`)
      ]);
      if (gameR.ok) overviewData[slot] = await gameR.json();
      if (idxR.ok) {
        const idxData = await idxR.json();
        const p = (idxData.pairings || [])[km.board - 1];
        if (p) overviewPairBySlot[slot] = p;
      }
    } catch(e) {}
  }));
  if (overviewMode) { renderOverview(); renderBoardSelector(); }
}

// ── Lagmatch: ladda ner PGN för bocade bräden ─────────────────
async function downloadTeamBoardsPGN() {
  const boards = [...teamCheckedBoards].sort((a, b) => a - b);
  const parts  = [];
  for (const g of boards) {
    try {
      const r = await fetchFresh(`${BASE}/${TID}/round-${ROUND}/game-${g}.json`);
      if (!r.ok) continue;
      const data = await r.json();
      const p    = overviewPairings[g - 1] || {};
      const wName = p.white ? playerLabel(p.white) : '?';
      const bName = p.black ? playerLabel(p.black) : '?';
      const res   = normalizeResult(data.result) || '*';
      const moves = (data.moves || []).map(mv =>
        typeof mv === 'string' ? mv.split(' ')[0] : (mv.m || mv.san || '')
      ).filter(Boolean);

      let pgn = `[Event "${escHtml(tournamentInfo ? tournamentInfo.name : 'Lagmatch')}"]\n`;
      pgn += `[Round "${ROUND}.${g}"]\n`;
      pgn += `[White "${wName}"]\n`;
      pgn += `[Black "${bName}"]\n`;
      pgn += `[Result "${res}"]\n\n`;
      let moveText = '';
      for (let i = 0; i < moves.length; i++) {
        if (i % 2 === 0) moveText += `${Math.floor(i / 2) + 1}. `;
        moveText += moves[i] + ' ';
      }
      pgn += moveText.trim() + ' ' + res;
      parts.push(pgn);
    } catch(e) { console.warn('PGN error board', g, e); }
  }
  if (!parts.length) return;
  const blob = new Blob([parts.join('\n\n')], { type: 'application/x-chess-pgn' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `lagmatch-rond${ROUND}.pgn`;
  a.click();
  URL.revokeObjectURL(url);
  teamCheckedBoards.clear();
  renderScheduleWidget();
}

// ── Bordsväljare ─────────────────────────────────────────────

// Bygg HTML för ett bräde i multi-vyn (skalat, inga koordinater)
function mbBoardHTML(data) {
  if (!data) data = { moves: [] };
  const c = new Chess();
  for (const mv of (data.moves || [])) {
    const san = typeof mv === 'string' ? mv.split(' ')[0] : (mv.m || mv.san || '');
    if (!san) break;
    try { c.move(san); } catch(e) { break; }
  }
  const pos = c.board();
  let html = '<div class="mb-board-grid">';
  for (let dr = 0; dr < 8; dr++) {
    for (let dc = 0; dc < 8; dc++) {
      const isLight = (dr + dc) % 2 === 0;
      const piece = pos[dr][dc];
      let inner = '';
      if (piece) {
        const key = piece.color + piece.type.toUpperCase();
        if (PIECE_SVG[key]) inner = `<img src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(PIECE_SVG[key])}" alt="${key}">`;
      }
      html += `<div class="mb-sq ${isLight ? 'light' : 'dark'}">${inner}</div>`;
    }
  }
  return html + '</div>';
}

// Render brädes-chips i väljaren
function renderBoardSelector() {
  const bar     = document.getElementById('board-selector');
  const chips   = document.getElementById('board-chips');
  const evalBtn = document.getElementById('btn-eval-toggle');
  if (!bar || !chips) return;

  const n = overviewPairings.length;
  // Lagmatch/schweizisk: navigering sker i högerkolumnen – dölj chip-raden
  if (n <= 1 || pgnMode || tournamentType === 'team' || tournamentType === 'swiss') { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';

  chips.innerHTML = overviewPairings.map((p, i) => {
    const g     = i + 1;
    const wName = p.white ? (p.white.lname || playerLabel(p.white) || '?') : '?';
    const bName = p.black ? (p.black.lname || playerLabel(p.black) || '?') : '?';
    const isSel = selectedBoards.has(g);
    const data  = overviewData[g];
    let dotHtml = '';
    if (data) {
      const norm   = normalizeResult(data.result);
      const isLive = data.live === true && (!norm || norm === '*');
      if (isLive) dotHtml = '<span class="bc-dot live">●</span>';
      else if (norm && norm !== '*') dotHtml = '<span class="bc-dot done">✓</span>';
    }
    return `<button class="board-chip${isSel ? ' bc-sel' : ''}" onclick="toggleBoardSelection(${g})">
      <span class="bc-num">B${g}</span>
      <span class="bc-names">${escHtml(wName)}–${escHtml(bName)}</span>
      ${dotHtml}
    </button>`;
  }).join('');

  // Eval-knapp: bara synlig i multi-vy
  if (evalBtn) {
    const isMulti = selectedBoards.size > 1;
    evalBtn.style.display = isMulti ? '' : 'none';
    if (isMulti) {
      evalBtn.className = ovEvalEnabled ? 'btn btn-primary' : 'btn';
      evalBtn.style.cssText = 'font-size:0.75rem;padding:4px 10px';
      evalBtn.textContent   = ovEvalEnabled ? '⬛ Eval PÅ' : '⬜ Eval AV';
    }
  }
}

// Klick på ett chip → välj/avvälj bräde
function toggleBoardSelection(g) {
  if (selectedBoards.has(g)) {
    if (selectedBoards.size <= 1) return; // minst ett bräde måste vara valt
    selectedBoards.delete(g);
  } else {
    selectedBoards.add(g);
  }

  const isMulti = selectedBoards.size > 1;

  if (isMulti) {
    if (!overviewMode) {
      overviewMode = true;
      if (pollTimer)       clearTimeout(pollTimer);
      if (clockTimer)      clearInterval(clockTimer);
      if (sfAnalysisTimer) clearTimeout(sfAnalysisTimer);
      ovEvalData = {};
      if (!ovEvalEnabled) stopOverviewAnalysis();
    }
    renderBoardSelector();
    startOverviewPolling();
  } else {
    const onlyBoard = [...selectedBoards][0];
    if (overviewMode) {
      overviewMode = false;
      stopOverviewPolling();
      stopOverviewAnalysis();
    }
    overviewData = {};
    renderBoardSelector();
    if (onlyBoard !== GAME) {
      GAME = onlyBoard;
      gameData = null; pairing = null; viewPly = 0; sfEval = null;
      if (clockTimer) clearInterval(clockTimer);
      if (pollTimer)  clearTimeout(pollTimer);
      document.getElementById('main').innerHTML =
        '<div class="loading"><div class="spinner"></div>Hämtar speldata…</div>';
      fetchPairing();
      schedulePoll(0);
    } else {
      renderAll();
      schedulePoll(2000);
      if (sfEnabled && sfWorker && sfReady) {
        const pos = buildAtPly(viewPly);
        if (pos) scheduleAnalysis(pos.fen());
      }
    }
  }
}

// Klick på ett bräde i multi-vy → fokusera enstaka bräde
function focusBoard(g) {
  if (!overviewMode) return;
  overviewMode = false;
  stopOverviewPolling();
  stopOverviewAnalysis();
  overviewData        = {};
  overviewPairBySlot  = {};
  const km = overviewKeyMap[g];
  overviewKeyMap      = {};
  if (km) {
    // Schema-läge: byt till rätt rond + bräde
    ROUND = km.round;
    GAME  = km.board;
  } else {
    GAME = g;
  }
  selectedBoards = new Set([GAME]);
  gameData = null; pairing = null; viewPly = 0; sfEval = null;
  if (clockTimer) clearInterval(clockTimer);
  if (pollTimer)  clearTimeout(pollTimer);
  renderBoardSelector();
  document.getElementById('main').innerHTML =
    '<div class="loading"><div class="spinner"></div>Hämtar speldata…</div>';
  fetchPairing();
  schedulePoll(0);
}

// Äldre funktion (bakåtkompatibilitet)
function switchToBoard(g) { focusBoard(g); }

// ── Kanalplattform ────────────────────────────────────────────
// Hämtar config.json och renderar kanaltabbar.
// Returnerar true om minst en kanal hittades (och första kanalen laddades).
async function fetchChannelConfig() {
  try {
    const r = await fetch('config.json', { cache: 'no-store' });
    if (!r.ok) return false;
    const data = await r.json();
    channels = (data.channels || []).filter(c => c.active !== false);
    renderChannelNav();
    if (channels.length > 0) {
      selectChannel(channels[0].id);
      return true;
    }
    return false;
  } catch(e) {
    console.warn('config.json kunde inte laddas:', e);
    return false;
  }
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderChannelNav() {
  const nav  = document.getElementById('channel-nav');
  const tabs = document.getElementById('channel-tabs');
  if (!nav || !tabs) return;
  if (channels.length === 0) { nav.classList.remove('has-channels'); return; }
  nav.classList.add('has-channels');
  tabs.innerHTML = channels.map(ch => {
    const isActive  = ch.id === activeChannelId;
    const typeLabel = ch.type === 'live' ? 'LIVE' : 'PGN';
    const typeCls   = ch.type === 'live' ? 'live' : 'pgn';
    return `<button class="channel-tab${isActive ? ' ch-active' : ''}"
        onclick="selectChannel('${escHtml(ch.id)}')">
      <span class="ch-type-badge ${typeCls}">${typeLabel}</span>
      ${escHtml(ch.title || '(namnlös)')}
    </button>`;
  }).join('');
}

function selectChannel(id) {
  const ch = channels.find(c => c.id === id);
  if (!ch) return;
  activeChannelId = id;
  renderChannelNav();

  // Sätt turneringstyp och lagnamn från kanalconfig
  tournamentType   = ch.tournamentType  || 'match';
  teamName1        = ch.team1           || null;
  teamName2        = ch.team2           || null;
  team1Board1Color = ch.team1Board1Color || 'black'; // default: hemmalag svart bräde 1
  teamCheckedBoards = new Set();

  if (ch.type === 'live') {
    // Extrahera UUID från TID-fältet (kan vara url eller ren uuid)
    const uuid = extractUUID(ch.tid || '');
    if (!uuid) { alert('Ogiltigt TID i kanal: ' + escHtml(ch.title)); return; }
    document.getElementById('cfg-id').value = uuid;
    document.getElementById('cfg-round').selectedIndex = 0;
    document.getElementById('cfg-game').selectedIndex  = 0;
    loadGame();

  } else if (ch.type === 'pgn') {
    if (!ch.pgn) { alert('Ingen PGN-data i kanal: ' + escHtml(ch.title)); return; }
    // Städa upp live-läge
    if (clockTimer) clearInterval(clockTimer);
    if (pollTimer)  clearTimeout(pollTimer);
    if (overviewMode) {
      overviewMode = false;
      stopOverviewPolling();
      overviewData = {}; overviewPairings = [];
      const btn = document.getElementById('btn-overview');
      if (btn) { btn.classList.remove('btn-primary'); btn.textContent = '⊞ Alla bräden'; }
    }
    // Parsea och aktivera PGN
    const games = parsePGN(ch.pgn);
    if (!games || games.length === 0) {
      alert('Inga giltiga partier hittades i PGN-datan för: ' + ch.title);
      return;
    }
    exitPGNMode();
    pgnMode = true;
    pgnGames = games;
    pgnCurrentGame = 0;
    document.getElementById('match-title').textContent = ch.title || 'PGN';
    const label = document.getElementById('pgn-file-label');
    if (label) label.textContent = ch.title || 'PGN-kanal';
    activatePGNGame(0);
  }
}


// ══════════════════════════════════════════════════════════════
// STADIONVY — visar alla 4 grupper × 3 bräden på en gång
// ══════════════════════════════════════════════════════════════

const STADIUM_GROUPS = [
  { id: 'grupp-1', label: 'Weekend 1 – grupp 1', tid: 'b9c6cd2c-e05d-4b1a-a4db-25c98c291b52', boards: 3 },
  { id: 'grupp-2', label: 'Weekend 1 – grupp 2', tid: '8d579e31-c216-43c4-817e-597ba58db845', boards: 3 },
  { id: 'grupp-3', label: 'Weekend 1 – grupp 3', tid: '3e1dead3-0b84-4d70-8dfe-34b099bd019b', boards: 3 },
  { id: 'grupp-4', label: 'Weekend 1 – grupp 4', tid: 'b0741cd4-79ba-4ad3-990b-4e766946ca16', boards: 3 },
];

let stadiumGameData = {};    // stadiumGameData['grupp-1'][1] = gameJson
let stadiumPairData = {};    // stadiumPairData['grupp-1'][1] = {white, black}
let stadiumPollTimer = null;
let stadiumMode = true;

// Bygg startsida — renderar alla grupper med tomma bräden som platshållare
function initStadium() {
  const sv = document.getElementById('stadium-view');
  if (!sv) return;

  let html = '';

  STADIUM_GROUPS.forEach(grp => {
    html += `<div class="stadium-group" id="stg-${grp.id}">
      <div class="sg-header">
        <span class="sg-title">${escHtml(grp.label)}</span>
        <span class="sg-live-badge" id="sg-live-${grp.id}"></span>
      </div>
      <div class="sg-boards">`;

    for (let b = 1; b <= grp.boards; b++) {
      html += `<div class="sg-board" onclick="focusGame('${grp.id}', ${b})" title="Klicka för fullständig spelvy">
        <div class="sg-board-top">
          <span class="sg-board-num">Bord ${b}</span>
          <span class="sg-board-result" id="sgr-${grp.id}-${b}"></span>
        </div>
        <div class="sg-players" id="sgp-${grp.id}-${b}">
          <div class="sg-player-row">
            <span class="sg-color-dot white"></span>
            <span class="sg-player-name">Vit</span>
          </div>
          <div class="sg-player-row">
            <span class="sg-color-dot black"></span>
            <span class="sg-player-name">Svart</span>
          </div>
        </div>
        <div class="sg-mini-board" id="sgmb-${grp.id}-${b}">
          ${mbBoardHTML(null)}
        </div>
        <div class="sg-eval-wrap" id="sge-${grp.id}-${b}">
          <div class="sg-eval-bar">
            <div class="sg-eval-w" id="sgew-${grp.id}-${b}" style="flex-grow:50"></div>
            <div class="sg-eval-b" id="sgeb-${grp.id}-${b}" style="flex-grow:50"></div>
          </div>
          <div class="sg-eval-score" id="sges-${grp.id}-${b}">…</div>
        </div>
        <button class="sg-analysis-btn" id="sgab-${grp.id}-${b}"
          onclick="event.stopPropagation(); toggleStadiumAnalysis('${grp.id}', ${b})">⚡ Analys AV</button>
      </div>`;
    }

    html += `</div></div>`;
  });

  sv.innerHTML = html;
}

async function fetchStadiumGroup(grp) {
  if (!stadiumGameData[grp.id]) stadiumGameData[grp.id] = {};
  if (!stadiumPairData[grp.id]) stadiumPairData[grp.id] = {};

  // Pairings
  try {
    const r = await fetch(`${BASE}/${grp.tid}/round-1/index.json`, { cache: 'no-store' });
    if (r.ok) {
      const idx = await r.json();
      (idx.pairings || []).forEach((p, i) => {
        stadiumPairData[grp.id][i + 1] = p;
      });
    }
  } catch(e) {}

  // Game data (alla 3 bräden parallellt)
  await Promise.all(
    Array.from({ length: grp.boards }, (_, i) => i + 1).map(async b => {
      try {
        const r = await fetch(`${BASE}/${grp.tid}/round-1/game-${b}.json`, { cache: 'no-store' });
        if (r.ok) stadiumGameData[grp.id][b] = await r.json();
      } catch(e) {}
    })
  );

  updateStadiumGroup(grp);
}

function updateStadiumGroup(grp) {
  let liveCount = 0;

  for (let b = 1; b <= grp.boards; b++) {
    const data = (stadiumGameData[grp.id] || {})[b] || null;
    const pair = (stadiumPairData[grp.id] || {})[b] || null;

    // Spelarsnamn
    const pEl = document.getElementById(`sgp-${grp.id}-${b}`);
    if (pEl && pair) {
      const wName = pair.white ? playerLabel(pair.white) : 'Vit';
      const bName = pair.black ? playerLabel(pair.black) : 'Svart';
      const wRating = (pair.white && pair.white.rating) ? `<span class="sg-player-rating">${pair.white.rating}</span>` : '';
      const bRating = (pair.black && pair.black.rating) ? `<span class="sg-player-rating">${pair.black.rating}</span>` : '';
      pEl.innerHTML = `
        <div class="sg-player-row"><span class="sg-color-dot white"></span><span class="sg-player-name">${escHtml(wName)}</span>${wRating}</div>
        <div class="sg-player-row"><span class="sg-color-dot black"></span><span class="sg-player-name">${escHtml(bName)}</span>${bRating}</div>`;
    }

    // Mini-bräde
    const mbEl = document.getElementById(`sgmb-${grp.id}-${b}`);
    if (mbEl) mbEl.innerHTML = mbBoardHTML(data);

    // Resultat/status
    const resEl = document.getElementById(`sgr-${grp.id}-${b}`);
    if (resEl && data) {
      const norm   = normalizeResult(data.result);
      const isLive = data.live === true && (!norm || norm === '*');
      if (isLive) {
        resEl.innerHTML = '<span class="sg-live-dot">●</span> LIVE';
        resEl.className = 'sg-board-result live';
        liveCount++;
      } else if (norm && norm !== '*') {
        resEl.textContent = resultLabel(norm);
        resEl.className = 'sg-board-result done';
      } else {
        resEl.textContent = '';
        resEl.className = 'sg-board-result';
      }
    }
  }

  // Live-badge i grupphuvudet
  const liveEl = document.getElementById(`sg-live-${grp.id}`);
  if (liveEl) {
    if (liveCount > 0) {
      liveEl.innerHTML = `<span class="sg-live-dot">●</span> ${liveCount} LIVE`;
    } else {
      liveEl.textContent = '';
    }
  }

  // Starta om analys om motorn är redo men inaktiv (t.ex. data kom efter att analys slogs på)
  if (stadiumMode && sfWorker && sfReady && !sfSearching && getEnabledStadiumBoards().length > 0) {
    analyzeNextStadiumBoard();
  }
}

async function pollStadium() {
  if (!stadiumMode) return;
  await Promise.all(STADIUM_GROUPS.map(g => fetchStadiumGroup(g)));
  if (stadiumMode) stadiumPollTimer = setTimeout(pollStadium, 5000);
}

function focusGame(gid, board) {
  const grp = STADIUM_GROUPS.find(g => g.id === gid);
  if (!grp) return;

  // Stopp stadion-poll
  stadiumMode = false;
  if (stadiumPollTimer) { clearTimeout(stadiumPollTimer); stadiumPollTimer = null; }

  // Byt visning
  document.getElementById('stadium-view').style.display = 'none';
  document.getElementById('game-view').style.display = 'flex';
  document.getElementById('game-view').style.flexDirection = 'column';
  document.getElementById('game-view').style.alignItems = 'center';

  // Stoppa pågående parti-poll
  if (pollTimer)  clearTimeout(pollTimer);
  if (clockTimer) clearInterval(clockTimer);
  overviewMode = false;
  gameData = null; pairing = null; viewPly = 0; sfEval = null;

  // Konfigurera TID, rond, bräde
  TID   = grp.tid;
  ROUND = 1;
  GAME  = board;
  selectedBoards = new Set([board]);
  tournamentType = 'swiss';

  const cfgId = document.getElementById('cfg-id');
  const cfgRound = document.getElementById('cfg-round');
  const cfgGame = document.getElementById('cfg-game');
  if (cfgId) cfgId.value = grp.tid;
  if (cfgRound) cfgRound.selectedIndex = 0;
  if (cfgGame && board <= cfgGame.options.length) cfgGame.selectedIndex = board - 1;

  document.getElementById('match-title').textContent = `${grp.label} — Bord ${board}`;
  document.getElementById('main').innerHTML =
    '<div class="loading"><div class="spinner"></div>Hämtar speldata…</div>';

  fetchTournament();
  fetchPairing();
  schedulePoll(0);
}

function backToStadium() {
  // Stoppa parti-poll
  if (pollTimer)  clearTimeout(pollTimer);
  if (clockTimer) clearInterval(clockTimer);
  if (sfWorker && sfSearching) sfWorker.postMessage('stop');
  if (overviewMode) { overviewMode = false; stopOverviewPolling(); stopOverviewAnalysis(); }
  gameData = null; pairing = null;

  // Byt visning
  document.getElementById('game-view').style.display = 'none';
  document.getElementById('stadium-view').style.display = '';

  // Starta stadion-poll igen
  stadiumMode = true;
  pollStadium();
}

// ── Modifierad init: starta i stadionvy ──────────────────────

// ── Stadium Stockfish-analys ─────────────────────────────────
let stadiumAnalysisEnabled = {}; // {gid: Set<board>}
let stadiumEvalData       = {}; // {gid: {b: {type, value, btm}}}
let stadiumCurrentAn      = null; // {gid, board}

function toggleStadiumAnalysis(gid, board) {
  if (!stadiumAnalysisEnabled[gid]) stadiumAnalysisEnabled[gid] = new Set();
  const en = stadiumAnalysisEnabled[gid];
  const btn = document.getElementById(`sgab-${gid}-${board}`);
  const evalEl = document.getElementById(`sge-${gid}-${board}`);

  if (en.has(board)) {
    en.delete(board);
    if (btn)    { btn.textContent = '⚡ Analys AV'; btn.classList.remove('sg-on'); }
    if (evalEl) evalEl.style.display = 'none';
    // Stoppa pågående sökning om detta var aktuellt bräde
    if (stadiumCurrentAn && stadiumCurrentAn.gid === gid && stadiumCurrentAn.board === board) {
      if (sfWorker && sfSearching) sfWorker.postMessage('stop');
      stadiumCurrentAn = null;
    }
  } else {
    en.add(board);
    if (btn)    { btn.textContent = '⚡ Analys PÅ'; btn.classList.add('sg-on'); }
    if (evalEl) evalEl.style.display = 'block';
    // Starta motorn vid behov
    if (!sfWorker) {
      if (btn) btn.textContent = '⚡ Laddar motor…';
      initStockfish(); // analyzeNextStadiumBoard anropas från readyok
    } else if (sfReady && !sfSearching) {
      stadiumCurrentAn = null;
      analyzeNextStadiumBoard();
    }
  }
}

function getEnabledStadiumBoards() {
  const result = [];
  STADIUM_GROUPS.forEach(grp => {
    const en = stadiumAnalysisEnabled[grp.id];
    if (!en) return;
    for (let b = 1; b <= grp.boards; b++) {
      if (en.has(b)) result.push({ gid: grp.id, board: b });
    }
  });
  return result;
}

function analyzeNextStadiumBoard() {
  if (!stadiumMode || !sfWorker || !sfReady) return;
  const all = getEnabledStadiumBoards();
  if (!all.length) return;

  // Nästa bräde i cykeln
  let nextIdx = 0;
  if (stadiumCurrentAn) {
    const cur = all.findIndex(x => x.gid === stadiumCurrentAn.gid && x.board === stadiumCurrentAn.board);
    if (cur >= 0) nextIdx = (cur + 1) % all.length;
  }
  const next = all[nextIdx];
  stadiumCurrentAn = next;

  const data = (stadiumGameData[next.gid] || {})[next.board] || null;
  if (!data) {
    setTimeout(analyzeNextStadiumBoard, 400);
    return;
  }

  const c = new Chess();
  for (const mv of (data.moves || [])) {
    const san = typeof mv === 'string' ? mv.split(' ')[0] : (mv.m || mv.san || '');
    if (!san) break;
    try { c.move(san); } catch(e) { break; }
  }
  const blackToMove = c.turn() === 'b';
  if (!stadiumEvalData[next.gid]) stadiumEvalData[next.gid] = {};
  stadiumEvalData[next.gid][next.board] = stadiumEvalData[next.gid][next.board] || {};
  stadiumEvalData[next.gid][next.board].btm = blackToMove;

  sfSearching = true;
  sfCurrentFen = c.fen();
  sfWorker.postMessage('setoption name MultiPV value 1');
  sfWorker.postMessage('position fen ' + sfCurrentFen);
  sfWorker.postMessage('go depth 14');
}

function updateStadiumEval(gid, board) {
  const ev = (stadiumEvalData[gid] || {})[board];
  if (!ev) return;
  const normV = ev.btm ? -ev.value : ev.value;
  let wPct;
  if (ev.type === 'mate') {
    wPct = normV > 0 ? 95 : 5;
  } else {
    wPct = 50 + 50 * Math.tanh(normV / 400);
  }
  const bPct = 100 - wPct;
  let score;
  if (ev.type === 'mate') {
    score = normV > 0 ? `M${Math.abs(ev.value)}` : `-M${Math.abs(ev.value)}`;
  } else {
    const p = (Math.abs(normV) / 100).toFixed(2);
    score = normV >= 0 ? `+${p}` : `-${p}`;
  }
  const wEl = document.getElementById(`sgew-${gid}-${board}`);
  const bEl = document.getElementById(`sgeb-${gid}-${board}`);
  const sEl = document.getElementById(`sges-${gid}-${board}`);
  if (wEl) wEl.style.flexGrow = wPct.toFixed(1);
  if (bEl) bEl.style.flexGrow = bPct.toFixed(1);
  if (sEl) sEl.textContent = score;
}

// ── Init ──────────────────────────────────────────────────────
(async function() {
  // Starta i stadionvy som standard
  initStadium();
  pollStadium();

  // Förhindra att piltangenter scrollar sidan
  window.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowRight','Home','End'].includes(e.key) &&
        e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
      e.preventDefault();
    }
  }, { passive: false });
})();
